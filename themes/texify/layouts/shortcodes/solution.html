{{/* layouts/shortcodes/solution.html */}}
{{- $lang := .Get "lang" | default .Page.Language.Lang -}}

<div class="math-env style-proof"
     data-kind="solution"
     data-lang="{{ $lang }}"
     data-numbered="false">
  <span class="math-heading">
    <span class="math-title"
          data-label='{{ if eq $lang "zh" }}解{{ else }}Solution{{ end }}'></span>{{ with .Get "note" }} <span class="math-note">({{ . }})</span>{{ end }}
  </span>
  <div class="math-body">
    {{ .Inner | markdownify }}
  </div>
</div>
